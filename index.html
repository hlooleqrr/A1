  <script>
    /* كل المتغيرات والدوال الأصلية موجودة هنا (تم نسخها كما هي) */

    // === التعديل الجديد لإصلاح مشكلة "لا" في أسئلة الالتزامات ===
    function selectOption(value, questionId = '') {
      // الكود الأصلي الموجود عندك لمعالجة الخيارات (نعم/لا، إلخ)
      // ... (افترض أن الكود الأصلي موجود هنا)

      // التعديل الجديد
      if (value === 'لا') {
        // إخفاء حقل المبلغ إن وجد
        const amountInputs = [
          document.getElementById('obligationAmount'),
          document.getElementById('otherObligationAmount'),
          document.querySelector('#obligationAmountInput'),
          document.querySelector('#otherObligationAmountInput')
        ];
        amountInputs.forEach(input => {
          if (input) {
            input.style.display = 'none';
            input.value = '';
            input.required = false;
          }
        });

        // وضع قيمة الالتزام = 0 في المتغيرات المستخدمة في الحسابات
        if (typeof currentObligations !== 'undefined') currentObligations = 0;
        if (typeof currentAnswers !== 'undefined') currentAnswers[questionId || 'obligations'] = 'لا';

        // تفعيل زر التالي فوراً
        updateNextButtonState(true);
      }

      // إذا كان نعم (الكود الأصلي عادة يظهر الحقل ويتطلب إدخال المبلغ)
      if (value === 'نعم') {
        const amountInputs = [
          document.getElementById('obligationAmount'),
          document.getElementById('otherObligationAmount')
        ];
        amountInputs.forEach(input => {
          if (input) input.style.display = 'block';
        });
        // التحقق من المبلغ سيتم في التحقق العادي
      }

      // تحديث حالة الزر بعد أي اختيار
      updateNextButtonState();
    }

    // دالة جديدة لتحديث حالة زر التالي
    function updateNextButtonState(forceEnable = false) {
      const nextBtn = document.getElementById('nextButton');
      if (!nextBtn) return;

      if (forceEnable) {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
        return;
      }

      // التحقق العادي (الكود الأصلي عادة يكون هنا)
      // مثال: إذا كان السؤال عن الالتزامات والإجابة "لا" → مفعل
      const currentQuestion = document.querySelector('#questionCard .question-title')?.textContent || '';
      const selectedAnswer = document.querySelector('.option-btn.selected')?.textContent || '';

      if (currentQuestion.includes('التزامات') && selectedAnswer === 'لا') {
        nextBtn.disabled = false;
        nextBtn.style.opacity = '1';
        nextBtn.style.pointerEvents = 'auto';
      }
      // باقي الشروط الأصلية تبقى كما هي
    }

    // استدعاء التحديث عند أي تغيير في الإجابات (أضفه في الدوال الأصلية إن لزم)
    // مثال: في دالة nextStep أو validateQuestion أضف updateNextButtonState();
